name: Publish

# ⚠️ THE FILENAME OF THIS FILE IS PART OF THE CREDENTIAL. DO NOT RENAME IT.
#
# This package publishes with npm TRUSTED PUBLISHING — there is no NPM_TOKEN.
# npm's trusted-publisher config names the org, the repo and THE WORKFLOW
# FILENAME, and the OIDC claim must match all three exactly, extension included.
# Renaming this file, or moving this job elsewhere, revokes publishing.
#
# It fails in a way that does not say so: `npm error 404 ... could not be found
# or you do not have permission`. A 404 on PUT is npm declining to reveal
# whether the package exists — not a missing package. Provenance signs
# successfully first, which makes it look as though auth worked.
#
# Nothing catches this before a tag: CI never runs the publish path, and npm
# does not validate the trusted-publisher config when it is saved. The first
# signal is a failed release. That is exactly how v0.3.0 failed on 2026-08-29,
# when this job was split out of ci.yml into this file and the npmjs.com config
# still named ci.yml.
#
# If this file ever must be renamed, change the workflow filename in the
# package's trusted-publisher settings on npmjs.com FIRST.

# Tags only. This used to be a job inside ci.yml gated on
# `if: startsWith(github.ref, 'refs/tags/v')`, which worked but reported a
# "Publish to npm — skipping" check on every pull request. A separate workflow
# never appears on a PR at all, and the trigger is legible from the filename
# rather than from an `if:` twenty lines down.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # npm trusted publishing — this repo has no NPM_TOKEN secret and does not
      # need one. The OIDC token is both the credential and the provenance
      # attestation, so removing this line breaks publishing entirely.
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # Splitting this out of ci.yml lost `needs: test`, so the suite runs here.
      # Without it a tag on a broken commit publishes, and an npm version cannot
      # be replaced once it is out.
      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # A tag that disagrees with package.json publishes the WRONG version, or
      # fails against the registry with a 403 that reads like an auth problem.
      # Fail here instead, where the message says what is actually wrong.
      - name: Tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}. Bump the version, or retag."
            exit 1
          fi
          echo "Publishing ${PKG}"

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
